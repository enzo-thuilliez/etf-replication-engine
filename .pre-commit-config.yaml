# pre-commit hooks for this repo (Rust workspace + Python package + web/ TS app).
# Install: `uv run pre-commit install` (after adding pre-commit to the dev deps / installing it).
#
# Rust and web hooks run via `language: system`, so `cargo` and `npm` must be available on PATH
# and `web/node_modules` installed (`npm install` in web/) for the web hooks to work.

repos:
  - repo: local
    hooks:
      - id: cargo-fmt
        name: cargo fmt
        entry: cargo fmt --all -- --check
        language: system
        types: [rust]
        pass_filenames: false

      - id: cargo-clippy
        name: cargo clippy
        entry: cargo clippy --workspace --all-targets -- -D warnings
        language: system
        types: [rust]
        pass_filenames: false

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.6.9
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: local
    hooks:
      - id: eslint
        name: eslint (web/)
        entry: bash -c 'cd web && npm run lint'
        language: system
        files: ^web/.*\.(ts|tsx)$
        pass_filenames: false

      - id: prettier
        name: prettier (web/)
        entry: bash -c 'cd web && npx prettier --check .'
        language: system
        files: ^web/
        pass_filenames: false
