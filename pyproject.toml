[project]
name = "etf-replication-agent"
version = "0.1.0"
description = "LangChain + Azure OpenAI agent that consumes the Rust MCP server (ETF replication engine)."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    # TODO: pin agent dependencies once the MCP tool contract (AGENTS.md) is implemented.
    # "langchain",
    # "langchain-openai",
    # "mcp",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.6",
    "pytest>=8",
    # "deepeval",
    # "ragas",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agent"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
