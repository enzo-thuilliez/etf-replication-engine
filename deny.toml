# cargo-deny: licences, security advisories, banned or duplicate crates.
[advisories]
version = 2
yanked = "deny"

[licenses]
version = 2
# The list covers common crates; entries no current dependency uses are fine.
unused-allowed-license = "allow"
allow = ["MIT", "Apache-2.0", "Apache-2.0 WITH LLVM-exception", "BSD-2-Clause", "BSD-3-Clause", "ISC", "Unicode-3.0", "Zlib"]

[bans]
multiple-versions = "warn"
wildcards = "deny"
# Workspace path dependencies (mcp-server → engine) have no version; fine for unpublished crates.
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
