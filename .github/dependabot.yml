version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    labels: ["type:deps", "area:engine"]
    commit-message:
      prefix: chore
      include: scope
    groups:
      cargo:
        patterns: ["*"]
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    labels: ["type:deps", "area:agent"]
    commit-message:
      prefix: chore
      include: scope
    groups:
      python:
        patterns: ["*"]
  - package-ecosystem: npm
    directory: /web
    schedule:
      interval: weekly
    labels: ["type:deps", "area:web"]
    commit-message:
      prefix: chore
      include: scope
    groups:
      web:
        patterns: ["*"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    labels: ["type:deps", "area:ci"]
    commit-message:
      prefix: ci
    groups:
      actions:
        patterns: ["*"]
