# Labels as code, synced by .github/workflows/labels.yml. Labels not listed here are deleted.
# Every issue: one type:*, one or more area:*, one priority:*.
- name: "area:agent"
  color: "0e8a16"
  description: "Python LangChain agent (src/agent/)"
- name: "area:ci"
  color: "0e8a16"
  description: "GitHub Actions, Dependabot, hooks"
- name: "area:data"
  color: "0e8a16"
  description: "Index and price data"
- name: "area:docs"
  color: "0e8a16"
  description: "README, AGENTS, DECISIONS, ROADMAP, SPECS"
- name: "area:engine"
  color: "0e8a16"
  description: "Rust optimization library (engine/)"
- name: "area:eval"
  color: "0e8a16"
  description: "Agent evaluation (eval/)"
- name: "area:mcp"
  color: "0e8a16"
  description: "MCP tools and axum API (mcp-server/)"
- name: "area:web"
  color: "0e8a16"
  description: "React dashboard (web/)"
- name: "blocked"
  color: "000000"
  description: "Waiting on something else"
- name: "good first issue"
  color: "7057ff"
  description: "Good for newcomers"
- name: "help wanted"
  color: "008672"
  description: "Extra attention is needed"
- name: "priority:p0"
  color: "b60205"
  description: "Blocks the current milestone"
- name: "priority:p1"
  color: "d93f0b"
  description: "Needed for the milestone"
- name: "priority:p2"
  color: "fbca04"
  description: "Nice to have, can slip"
- name: "type:chore"
  color: "1d76db"
  description: "Maintenance with no behaviour change"
- name: "type:ci"
  color: "1d76db"
  description: "CI workflows and repo automation"
- name: "type:deps"
  color: "1d76db"
  description: "Dependency updates"
- name: "type:docs"
  color: "1d76db"
  description: "Documentation only"
- name: "type:feat"
  color: "1d76db"
  description: "New capability"
- name: "type:fix"
  color: "1d76db"
  description: "Behaviour differs from the contract or docs"
- name: "type:perf"
  color: "1d76db"
  description: "Faster or lighter, same behaviour"
- name: "type:refactor"
  color: "1d76db"
  description: "Restructure without behaviour change"
- name: "type:test"
  color: "1d76db"
  description: "Tests only"
