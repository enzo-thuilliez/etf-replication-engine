[workspace]
resolver = "2"
members = ["engine", "mcp-server"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/enzo-thuilliez/etf-replication-engine"

# Shared dependency versions go here as the workspace grows, e.g.:
# [workspace.dependencies]
# serde = { version = "1", features = ["derive"] }

# Shared lints: every member opts in with `[lints] workspace = true`.
[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
unwrap_used = "warn"
expect_used = "warn"
module_name_repetitions = "allow"
